name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        # numpy's stubs use Python 3.12 syntax, which mypy can only parse on 3.12+.
        if: matrix.python-version == '3.13'
        run: mypy
      - name: Tests
        run: pytest
      - name: Smoke-run the simulation pipeline
        run: |
          python experiments/run_study.py --quick --out /tmp/quick
          python experiments/make_figures.py --results /tmp/quick
          python experiments/build_report.py
      - name: CLI
        run: abkit power --baseline 0.1 --mde 0.01
