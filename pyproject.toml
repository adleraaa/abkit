[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "Statistical tests for online A/B experiments, with a simulation study of their error rates"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yunlong Lu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
study = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "statsmodels>=0.14",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "scipy-stubs",
    "matplotlib>=3.8",
]

[project.scripts]
abkit = "abkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/abkit"]

[tool.ruff.lint.per-file-ignores]
# Inline CSS string: long lines are clearer than split selectors.
"experiments/build_report.py" = ["E501"]
